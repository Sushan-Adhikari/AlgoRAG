version: '3.8'

services:
  # AlgoRAG Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algorag-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - vector-db:/app/data/vector_db
    environment:
      - EMBED_BACKEND=${EMBED_BACKEND:-local}
      - VECTOR_DB_TYPE=${VECTOR_DB_TYPE:-chroma}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GENERATOR_MODEL=${GENERATOR_MODEL:-gemini-2.0-flash-exp}
    env_file:
      - .env
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - algorag-network

  # AlgoRAG Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algorag-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - algorag-network

  # Optional: Qdrant vector database (alternative to ChromaDB)
  # Uncomment if using Qdrant instead of ChromaDB
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: algorag-qdrant
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"
  #   volumes:
  #     - qdrant-data:/qdrant/storage
  #   networks:
  #     - algorag-network

networks:
  algorag-network:
    driver: bridge

volumes:
  vector-db:
  # qdrant-data:
